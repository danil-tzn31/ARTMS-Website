<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>ARTMS — Virtual Angel Archive</title>
    <meta
      name="description"
      content="A fan-made showcase of ARTMS across three eras: Dall (Devine All Love & Live), Club Icarus, and Hyper-Ego. Five members, three palettes, one archive."
    />
    <meta name="theme-color" content="#08060C" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARTMS — Virtual Angel Archive" />
    <meta
      property="og:description"
      content="Dall · Club Icarus · Hyper-Ego. A fan archive of ARTMS."
    />
    <meta property="og:image" content="/media/video/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ARTMS in the Dall era, from the archive's title sequence"
    />
    <meta property="og:locale" content="en_GB" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/brand/sigil.webp" fetchpriority="high" />
    <link rel="preload" as="image" href="/brand/artms-wordmark.png" />
    <link rel="preload" as="image" href="/media/video/hero.jpg" />

    <!-- Paint the first frame in the hero palette before React mounts, so the
         page never flashes white on a slow connection. The invert filter lives
         on :root, so this one value covers both modes — inverted, #08060c is
         the off-white the toggle is supposed to produce. -->
    <style>
      html {
        background: #08060c;
      }
    </style>

    <!-- Restore the invert preference before first paint. React sets the same
         attribute on mount, but that is one frame too late: a returning visitor
         with invert on would see the page flash in the wrong polarity. -->
    <script>
      try {
        document.documentElement.dataset.invert =
          localStorage.getItem('artms:invert') === '1' ? 'true' : 'false'
      } catch (e) {
        document.documentElement.dataset.invert = 'false'
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="font-family: monospace; padding: 2rem; color: #e8e6f0">
        This archive is built around scroll-driven animation and needs JavaScript
        enabled. Discography and member information are listed at
        <a href="https://en.wikipedia.org/wiki/Artms" style="color: #c9a7f0">Wikipedia</a>.
      </p>
    </noscript>
  </body>
</html>
