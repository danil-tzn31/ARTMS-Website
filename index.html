<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>ARTMS — Virtual Angel Archive</title>
    <meta
      name="description"
      content="A fan-made showcase of ARTMS across three eras: Dall (Devine All Love & Live), Club Icarus, and Hyper-Ego. Five members, three palettes, one archive."
    />
    <meta name="theme-color" content="#08060C" />
    <meta name="color-scheme" content="dark light" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="ARTMS — Virtual Angel Archive" />
    <meta
      property="og:description"
      content="Dall · Club Icarus · Hyper-Ego. A fan archive of ARTMS."
    />
    <meta property="og:image" content="/media/video/hero.jpg" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="preload" as="image" href="/media/video/hero.jpg" fetchpriority="high" />

    <!-- Paint the first frame in the hero palette before React mounts, so the
         page never flashes white on a slow connection. -->
    <style>
      html {
        background: #08060c;
      }
      html[data-invert='true'] {
        background: #f7f9f3;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <noscript>
      <p style="font-family: monospace; padding: 2rem; color: #e8e6f0">
        This archive is built around scroll-driven animation and needs JavaScript
        enabled. Discography and member information are listed at
        <a href="https://en.wikipedia.org/wiki/Artms" style="color: #c9a7f0">Wikipedia</a>.
      </p>
    </noscript>
  </body>
</html>
